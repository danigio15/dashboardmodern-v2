name: One-shot 0.15.20 branch patcher

on:
  push:
    branches:
      - fix/0.15.20-release-hardening-appliance-artwork

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/0.15.20-release-hardening-appliance-artwork
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_01520_fixes.py")
          source = path.read_text(encoding="utf-8")
          old = "text, count = re.subn(pattern, replacement, text, count=1, flags=flags)"
          new = "text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)"
          if old not in source:
              raise SystemExit("regex helper anchor not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python scripts/apply_01520_fixes.py
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify syntax and frontend contracts before committing
        run: |
          python -m compileall -q custom_components scripts tests
          npm run check:inline-syntax
          npm run test:frontend
      - name: Commit non-workflow fixes
        run: |
          git restore --source=HEAD -- \
            .github/workflows/e2e.yml \
            .github/workflows/release.yml \
            .github/workflows/branch-01520-patcher.yml \
            scripts/apply_01520_fixes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden 0.15.20 runtime and restore appliance artwork"
          git push origin HEAD:fix/0.15.20-release-hardening-appliance-artwork
