name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  playwright-project:
    name: playwright / ${{ matrix.project }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        project:
          - desktop
          - mobile
          - webkit-ipad
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Generate build metadata
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python scripts/generate_build_info.py --expected-commit "$GITHUB_SHA"
      - name: Run ${{ matrix.project }} E2E
        run: npx playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report
            test-results

  # Keep the historical required check name `playwright`, but make the three
  # browser projects run in parallel. This job is only the final gate/aggregator.
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    needs: playwright-project
    if: always()
    steps:
      - name: Verify all browser projects
        env:
          RESULT: ${{ needs.playwright-project.result }}
        run: |
          echo "Browser matrix result: $RESULT"
          test "$RESULT" = "success"
