name: Format save engine

on:
  push:
    branches:
      - fix/beta20-save-engine

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta20-save-engine
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write custom_components/dashboardmodern/frontend/e2e/save-engine.spec.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/e2e/save-engine.spec.js
          git commit -m "style: format save-engine e2e [formatted]"
          git push origin HEAD:fix/beta20-save-engine
