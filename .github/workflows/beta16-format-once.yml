name: Beta16 format once

on:
  push:
    branches:
      - fix/beta16-mobile-ui-room-mapping
    paths:
      - ".github/workflows/beta16-format-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta16-mobile-ui-room-mapping
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format beta16 E2E
        run: npx prettier --write custom_components/dashboardmodern/frontend/e2e/beta16-real-device-layout.spec.js
      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/e2e/beta16-real-device-layout.spec.js
          git commit -m "style: apply repository prettier to beta16 e2e"
          git push origin HEAD:fix/beta16-mobile-ui-room-mapping
