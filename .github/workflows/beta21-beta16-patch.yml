name: Beta21 beta16 patch

on:
  push:
    branches:
      - fix/beta21-temperature-labels-release-hygiene

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta21-temperature-labels-release-hygiene
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply patch
        run: python scripts/beta21_beta16_patch.py
      - name: Format regression test
        run: npx prettier --write custom_components/dashboardmodern/frontend/tests/temperature-labels-regression.test.js
      - name: Commit source fix
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/src/sections/beta16-real-device-layout-section.js custom_components/dashboardmodern/frontend/tests/temperature-labels-regression.test.js
          git commit -m "fix: keep temperature display names in beta16 row repair"
          git push origin HEAD:fix/beta21-temperature-labels-release-hygiene
