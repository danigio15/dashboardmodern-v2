name: Source snapshot

on:
  push:
    branches:
      - agent/0.15.8-repository-cleanup-performance-brand

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.15.8-repository-cleanup-performance-brand
          fetch-depth: 0
      - name: Apply audited modular cleanup
        run: |
          cat scripts/cleanup-bundle.part-* | base64 --decode > /tmp/dashboardmodern-cleanup.tar.gz
          tar -xzf /tmp/dashboardmodern-cleanup.tar.gz
          python scripts/modularize_legacy_shell.py
          rm -f scripts/cleanup-bundle.part-*
      - name: Verify modular shell before commit
        run: |
          npm run check:inline-syntax
          npm run test:frontend
          python -m py_compile scripts/modularize_legacy_shell.py scripts/generate_build_info.py
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: externalize legacy shell and normalize brand assets"
          git push origin HEAD:agent/0.15.8-repository-cleanup-performance-brand
