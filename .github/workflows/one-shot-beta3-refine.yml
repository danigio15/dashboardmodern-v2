name: One-shot beta3 refine

on:
  push:
    branches:
      - fix/beta2-ui-coherence-report

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta2-ui-coherence-report
          fetch-depth: 0
      - name: Refine EV, room and climate UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          catalog = "custom_components/dashboardmodern/frontend/src/core/personalization-catalog.js"
          personal = "custom_components/dashboardmodern/frontend/src/sections/personalization-section.js"

          replace_once(
              catalog,
              "export const ACTION_ICON_CATALOG = Object.freeze([\n",
              '''export const CAR_ICON_CATALOG = Object.freeze([\n  ["electric","Elettrica","Electric","mdi:car-electric","⚡"],["car","Auto","Car","mdi:car","🚗"],["sports","Sportiva","Sports","mdi:car-sports","🏎️"],\n  ["hatchback","Compatta","Hatchback","mdi:car-hatchback","🚙"],["estate","Station wagon","Estate","mdi:car-estate","🚘"],["pickup","Pickup","Pickup","mdi:car-pickup","🛻"],\n  ["convertible","Cabrio","Convertible","mdi:car-convertible","🏎️"],["wagon","SUV / Wagon","SUV / Wagon","mdi:car-wagon","🚙"],\n].map(([id,it,en,mdi,glyph]) => Object.freeze({ id,it,en,mdi,glyph })));\n\nexport const ACTION_ICON_CATALOG = Object.freeze([\n''',
          )

          replace_once(
              catalog,
              "export function actionCatalogMatch(value) {\n",
              '''export function carIconMatch(value) {\n  const token = normalized(value).replace(/^mdi:/, "").replace(/[-_]+/g, " ");\n  if (!token) return CAR_ICON_CATALOG[0];\n  return CAR_ICON_CATALOG.find((item) =>\n    normalized(item.id) === token || normalized(item.mdi).replace(/^mdi:/, "").replace(/[-_]+/g, " ") === token ||\n    normalized(item.it) === token || normalized(item.en) === token\n  ) || CAR_ICON_CATALOG.find((item) => token.includes(normalized(item.id))) || null;\n}\n\nexport function carIconVisual(value, size = 48) {\n  const item = carIconMatch(value) || CAR_ICON_CATALOG[0];\n  const safeSize = Math.max(20, Math.min(160, Number(size) || 48));\n  const glyphSize = Math.max(16, Math.round(safeSize * 0.52));\n  return `<span class="dm-car-icon-glyph" data-car-icon="${item.id}" title="${item.it}" style="width:${safeSize}px;height:${safeSize}px;font-size:${glyphSize}px"><span aria-hidden="true">${item.glyph}</span></span>`;\n}\n\nexport function actionCatalogMatch(value) {\n''',
          )

          replace_once(
              personal,
              'import { ACTION_ICON_CATALOG, CAR_BRANDS, ROOM_CATALOG, actionVisual, carBrandVisual, roomVisual } from "../core/personalization-catalog.js";',
              'import { ACTION_ICON_CATALOG, CAR_BRANDS, CAR_ICON_CATALOG, ROOM_CATALOG, actionVisual, carBrandVisual, carIconVisual, roomVisual } from "../core/personalization-catalog.js";',
          )

          replace_once(
              personal,
              '''  const title = kind === "car" ? t("Scegli il brand auto", "Choose car brand") : kind === "action" ? t("Scegli l'icona azione", "Choose action icon") : t("Scegli l'icona stanza", "Choose room icon");\n  const titleIcon = kind === "car" ? "🚘" : kind === "action" ? "⚡" : "🏠";\n  const rows = kind === "car"\n    ? CAR_BRANDS.map((item) => ({ value: item.name, label: item.name, visual: carBrandVisual(item.name, 48), search: item.name }))\n    : kind === "action"\n      ? ACTION_ICON_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: actionVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.id} ${item.mdi}` }))\n      : ROOM_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: roomVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.keywords}` }));\n''',
              '''  const title = kind === "car" ? t("Scegli il brand auto", "Choose car brand") : kind === "car-icon" ? t("Scegli l'icona auto", "Choose car icon") : kind === "action" ? t("Scegli l'icona azione", "Choose action icon") : t("Scegli l'icona stanza", "Choose room icon");\n  const titleIcon = kind === "car" || kind === "car-icon" ? "🚘" : kind === "action" ? "⚡" : "🏠";\n  const rows = kind === "car"\n    ? CAR_BRANDS.map((item) => ({ value: item.name, label: item.name, visual: carBrandVisual(item.name, 48), search: item.name }))\n    : kind === "car-icon"\n      ? CAR_ICON_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: carIconVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.id} ${item.mdi}` }))\n      : kind === "action"\n        ? ACTION_ICON_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: actionVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.id} ${item.mdi}` }))\n        : ROOM_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: roomVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.keywords}` }));\n''',
          )

          replace_once(
              personal,
              '''    const category = clean(button.dataset.iconCategory || input.dataset.iconCategory);\n    button.classList.add("dm-icon-preview-button");\n    button.setAttribute("aria-label", category === "rooms" ? t("Scegli icona stanza", "Choose room icon") : t("Scegli icona", "Choose icon"));\n    const refresh = () => {\n      const value = clean(input.value);\n      button.innerHTML = category === "rooms" ? (roomVisual(value, 34) || iconMarkup(value || "mdi:home", 30)) : (actionVisual(value, 34) || iconMarkup(value || "mdi:star", 30));\n    };\n''',
              '''    const explicitCategory = clean(button.dataset.iconCategory || input.dataset.iconCategory);\n    const looksLikeRoom = explicitCategory === "rooms" || /room|stanza|ed-st|floor/i.test(`${input.id || ""} ${button.title || ""} ${button.getAttribute("onclick") || ""}`);\n    const category = looksLikeRoom ? "rooms" : explicitCategory;\n    button.classList.add("dm-icon-preview-button");\n    button.setAttribute("aria-label", category === "rooms" ? t("Scegli icona stanza", "Choose room icon") : t("Scegli icona", "Choose icon"));\n    const refresh = () => {\n      const value = clean(input.value);\n      button.innerHTML = category === "rooms" ? (roomVisual(value, 34) || iconMarkup(value || "mdi:home", 30)) : (actionVisual(value, 34) || iconMarkup(value || "mdi:star", 30));\n    };\n''',
          )

          replace_once(
              personal,
              '''    for (const editorTab of EDITOR_TABS_FOR_SECTION[key] || []) {\n      doc?.querySelectorAll?.(`.ed-tab[data-tab="${CSS.escape(editorTab)}"]`).forEach((button) => replaceButtonLabel(button, value));\n    }\n    const page = doc?.getElementById?.(`page-${key}`);\n''',
              '''    for (const editorTab of EDITOR_TABS_FOR_SECTION[key] || []) {\n      doc?.querySelectorAll?.(`.ed-tab[data-tab="${CSS.escape(editorTab)}"]`).forEach((button) => replaceButtonLabel(button, value));\n    }\n    doc?.querySelectorAll?.(`.ed-row[data-section-key="${CSS.escape(key)}"] .ed-row-new`).forEach((node) => {\n      const raw = clean(node.textContent);\n      const icon = raw.match(/^[^\\p{L}\\p{N}]+/u)?.[0] || "";\n      node.textContent = `${icon}${value}`;\n    });\n    const page = doc?.getElementById?.(`page-${key}`);\n''',
          )

          replace_once(
              personal,
              '${actionVisual(icon, 48) || iconMarkup(icon, 42)}</button><input class="ed-input" data-icon value="${esc(icon)}">',
              '${carIconVisual(icon, 48) || iconMarkup(icon, 42)}</button><input class="ed-input" data-icon value="${esc(icon)}">',
          )
          replace_once(
              personal,
              'panel.querySelector("[data-icon-preview]").addEventListener("click", () => openVisualPicker(iconInput, "action"));',
              'panel.querySelector("[data-icon-preview]").addEventListener("click", () => openVisualPicker(iconInput, "car-icon"));',
          )
          replace_once(
              personal,
              'iconInput.addEventListener("input", () => { panel.querySelector("[data-icon-preview]").innerHTML = actionVisual(iconInput.value, 48) || iconMarkup(iconInput.value, 42); });',
              'iconInput.addEventListener("input", () => { panel.querySelector("[data-icon-preview]").innerHTML = carIconVisual(iconInput.value, 48) || iconMarkup(iconInput.value, 42); });',
          )

          replace_once(
              personal,
              '.dm-room-art,.dm-car-brand{display:inline-grid;place-items:center;color:var(--primary-color,#0ea5e9)}.dm-action-glyph{display:inline-grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--primary-color,#0ea5e9) 10%,var(--card-background-color,#fff));line-height:1}',
              '.dm-room-art,.dm-car-brand{display:inline-grid;place-items:center;color:var(--primary-color,#0ea5e9)}.dm-action-glyph,.dm-car-icon-glyph{display:inline-grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--primary-color,#0ea5e9) 10%,var(--card-background-color,#fff));line-height:1}',
          )

          replace_once(
              personal,
              '#page-clima .clima-premium-grid{grid-template-columns:1fr!important;gap:12px!important}#page-clima .clima-premium-grid>:not([style*="grid-column"]){min-height:300px!important;height:clamp(300px,48vh,370px)!important;max-height:370px!important;padding:14px!important}',
              '#page-clima .clima-premium-grid{grid-template-columns:1fr!important;gap:12px!important}#page-clima .cp-card,#page-clima .clima-premium-grid>:not([style*="grid-column"]){aspect-ratio:auto!important;min-height:270px!important;height:auto!important;max-height:none!important;padding:14px!important}',
          )
          PY
      - name: Validate refinement
        run: |
          git diff --check
          node --check custom_components/dashboardmodern/frontend/src/core/personalization-catalog.js
          node --check custom_components/dashboardmodern/frontend/src/sections/personalization-section.js
          node --test custom_components/dashboardmodern/frontend/tests/beta3-ui-coherence.test.js
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/src/core/personalization-catalog.js \
                  custom_components/dashboardmodern/frontend/src/sections/personalization-section.js
          git commit -m "fix: scope EV icon catalog and compact climate cards"
          git push origin HEAD:fix/beta2-ui-coherence-report
