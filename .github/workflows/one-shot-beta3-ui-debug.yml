name: One-shot beta3 UI debug

on:
  push:
    branches:
      - fix/beta2-ui-coherence-report

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta2-ui-coherence-report
          fetch-depth: 0
      - name: Capture patch failure
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import traceback
          source = Path('.github/workflows/one-shot-beta3-ui-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          try:
              start = source.index(marker) + len(marker)
              end = source.index("\n          PY\n", start)
              script = dedent(source[start:end])
              exec(compile(script, '<beta3-ui-patcher>', 'exec'))
              result = 'PATCH SCRIPT COMPLETED\n'
          except BaseException:
              result = traceback.format_exc()
          Path('.beta3-patch-debug.txt').write_text(result)
          PY
      - name: Commit debug
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .beta3-patch-debug.txt
          git commit -m "chore: capture beta3 patch debug"
          git push origin HEAD:fix/beta2-ui-coherence-report
