name: Beta21 branch patch

on:
  push:
    branches:
      - fix/beta21-temperature-labels-release-hygiene

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta21-temperature-labels-release-hygiene
          fetch-depth: 0
      - name: Apply beta21 fixes and hygiene
        run: python scripts/beta21_patch.py
      - name: Commit branch changes
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/beta21-autopatch.yml' ':!scripts/beta21_patch.py'
          git commit -m "fix: complete beta21 temperature labels and release hygiene"
          git push origin HEAD:fix/beta21-temperature-labels-release-hygiene
