# DM-FIX-20260812B
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        shell: bash
        run: |
          set -o pipefail
          : > frontend-test.log
          python scripts/generate_build_info.py --expected-commit "$GITHUB_SHA" 2>&1 | tee -a frontend-test.log
          npm run check:inline-syntax 2>&1 | tee -a frontend-test.log
          npm run format:check 2>&1 | tee -a frontend-test.log
          npm run test:frontend 2>&1 | tee -a frontend-test.log
      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-diagnostics
          path: |
            frontend-test.log
            custom_components/dashboardmodern/frontend/src/sections/appliance-layout-section.js
          if-no-files-found: warn
