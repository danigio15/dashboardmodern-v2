name: Fix 0.15.20 editor runtime SRI E2E

on:
  push:
    branches:
      - fix/0.15.20-release-hardening-appliance-artwork

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/0.15.20-release-hardening-appliance-artwork
          fetch-depth: 0
      - name: Patch editor runtime CDN stubs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/dashboardmodern/frontend/e2e/editor-runtime.spec.js")
          text = path.read_text(encoding="utf-8")

          anchor = 'import { clickStableButton } from "./helpers/navigation.js";\n\n'
          helper = '''async function disableSriForMockedExternalScripts(page) {\n  // These E2E routes replace the pinned CDN files with deterministic stubs.\n  // Their bytes intentionally differ from production, so SRI would reject the\n  // stubs. Strip SRI only from the document served inside this test; the\n  // committed legacy HTML remains pinned/SRI-protected and is validated by the\n  // release-hardening frontend contract.\n  await page.route(/\\/legacy\\/dashboard(?:-en)?\\.html(?:\\?.*)?$/, async (route) => {\n    const response = await route.fetch();\n    const body = (await response.text()).replace(\n      /\\s+integrity="sha384-[^"]+"\\s+crossorigin="anonymous"/g,\n      "",\n    );\n    await route.fulfill({ response, body });\n  });\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"import anchor count: {text.count(anchor)}")
          text = text.replace(anchor, anchor + helper, 1)

          route_anchor = '    await page.route("https://**", '
          count = text.count(route_anchor)
          if count != 2:
              raise SystemExit(f"HTTPS route anchor count: {count}")
          text = text.replace(
              route_anchor,
              '    await disableSriForMockedExternalScripts(page);\n' + route_anchor,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Check patch
        run: |
          git diff --check
          grep -n "disableSriForMockedExternalScripts" custom_components/dashboardmodern/frontend/e2e/editor-runtime.spec.js
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-01520-editor-runtime-sri.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: isolate SRI from mocked CDN editor runtime"
          git push origin HEAD:fix/0.15.20-release-hardening-appliance-artwork
