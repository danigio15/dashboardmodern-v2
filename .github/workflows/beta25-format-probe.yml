name: Beta25 format probe

on:
  pull_request:
    paths:
      - "custom_components/dashboardmodern/frontend/e2e/beta25-real-device-regressions.spec.js"
      - ".github/workflows/beta25-format-probe.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print Prettier result
        run: npx prettier custom_components/dashboardmodern/frontend/e2e/beta25-real-device-regressions.spec.js
