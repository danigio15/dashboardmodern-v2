name: Republish v0.14.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/republish-v0.14.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version
        run: |
          python - <<'PY'
          import json
          version = json.load(open('custom_components/dashboardmodern/manifest.json'))['version']
          if version != '0.14.4':
              raise SystemExit(f'Expected manifest 0.14.4, found {version}')
          PY

      - name: Build release archive
        run: python scripts/build_release.py --expected-commit "$GITHUB_SHA" --output dashboardmodern.zip

      - name: Move tag and replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.14.4 "$GITHUB_SHA"
          git push origin refs/tags/v0.14.4 --force

          if gh release view v0.14.4 >/dev/null 2>&1; then
            gh release edit v0.14.4 --title "DashboardModern v0.14.4" --target "$GITHUB_SHA"
            gh release upload v0.14.4 dashboardmodern.zip --clobber
          else
            gh release create v0.14.4 dashboardmodern.zip \
              --title "DashboardModern v0.14.4" \
              --generate-notes \
              --verify-tag
          fi
