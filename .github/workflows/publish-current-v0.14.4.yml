name: Publish current v0.14.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.14.4
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify version
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/dashboardmodern/manifest.json'))['version'])")
          test "$version" = "0.14.4"

      - name: Build release archive
        run: python scripts/build_release.py --expected-commit "$GITHUB_SHA" --output dashboardmodern.zip

      - name: Move tag and recreate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.14.4 "$GITHUB_SHA"
          git push origin refs/tags/v0.14.4 --force
          gh release delete v0.14.4 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v0.14.4 dashboardmodern.zip --repo "$GITHUB_REPOSITORY" --title "DashboardModern v0.14.4" --generate-notes --verify-tag
