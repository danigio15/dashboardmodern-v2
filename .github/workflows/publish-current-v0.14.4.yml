name: Publish current v0.14.4

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.14.4
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build exact merged revision
        run: |
          git checkout --detach fab1d487b952e4f49a11903f722480d02eb71be9
          version=$(python -c "import json; print(json.load(open('custom_components/dashboardmodern/manifest.json'))['version'])")
          test "$version" = "0.14.4"
          python scripts/build_release.py --expected-commit "fab1d487b952e4f49a11903f722480d02eb71be9" --output dashboardmodern.zip

      - name: Move tag and recreate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.14.4 fab1d487b952e4f49a11903f722480d02eb71be9
          git push origin refs/tags/v0.14.4 --force
          gh release delete v0.14.4 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create v0.14.4 dashboardmodern.zip --repo "$GITHUB_REPOSITORY" --title "DashboardModern v0.14.4" --generate-notes --verify-tag

      - name: Remove one-shot publisher
        run: |
          git switch -C main origin/main
          git rm .github/workflows/publish-current-v0.14.4.yml
          git commit -m "Remove one-shot v0.14.4 publisher"
          git push origin main
