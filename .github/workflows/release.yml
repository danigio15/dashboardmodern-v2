name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify before releasing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: |
          python scripts/generate_build_info.py --expected-commit "$GITHUB_SHA"
          python -m pytest -q
          npm run check:inline-syntax
          npm run test:frontend
      - name: Check the tag matches the manifest version
        # A release whose tag and manifest disagree installs as one version and
        # reports another, which makes every later bug report ambiguous.
        run: |
          manifest=$(python -c "import json;print(json.load(open('custom_components/dashboardmodern/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Generate build provenance from the tagged HEAD
        run: python scripts/build_release.py --expected-commit "$GITHUB_SHA" --output dashboardmodern.zip
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dashboardmodern.zip
