name: One-shot beta3 version

on:
  push:
    branches:
      - fix/beta2-ui-coherence-report

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta2-ui-coherence-report
          fetch-depth: 0
      - name: Bump beta3 metadata and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "1.0.0-beta.2"
          new = "1.0.0-beta.3"
          for name in [
              "custom_components/dashboardmodern/manifest.json",
              "custom_components/dashboardmodern/frontend/legacy/build-info.js",
              "custom_components/dashboardmodern/frontend/tests/release-01520-version.test.js",
          ]:
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"{name}: {old} not found")
              path.write_text(text.replace(old, new))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "# Changelog\n\n"
          if not text.startswith(marker):
              raise SystemExit("CHANGELOG header not found")
          section = """## 1.0.0-beta.3 — 2026-08-10

### Corretto

- **Aspetto auto** compare soltanto nella Config EV e usa picker distinti per brand e icona vettura, senza riutilizzare il catalogo Stanze/Azioni.
- Stanze e Azioni mostrano anteprime locali visibili; la tavolozza separata viene rimossa e il picker si apre cliccando direttamente sull'icona.
- Il **Rinomina sezione** è integrato accanto all'ordine navbar con una matita e aggiorna anche il nome della relativa scheda Config.
- Le card **Clima** su mobile non ereditano più il rapporto 1:1 che le rendeva enormi; il contenuto torna compatto e ad altezza naturale.
- La Config **MiniPC** mostra esplicitamente nome parametro, riferimento ed entità configurata invece di card apparentemente vuote.
- L'**Andamento giornaliero** del Report Energia ritenta le statistiche Recorder con payload compatibile e, se necessario, usa il renderer storico compatibile prima di mostrare errore.
- Aggiunti contratti automatici ed E2E per scoping EV, picker auto dedicati, icone, rinomina, MiniPC, Clima e compatibilità Recorder.

"""
          changelog.write_text(marker + section + text[len(marker):])
          PY
      - name: Validate release metadata
        run: |
          git diff --check
          grep -q '"version": "1.0.0-beta.3"' custom_components/dashboardmodern/manifest.json
          grep -q 'integrationVersion: "1.0.0-beta.3"' custom_components/dashboardmodern/frontend/legacy/build-info.js
          grep -q 'const RELEASE_VERSION = "1.0.0-beta.3"' custom_components/dashboardmodern/frontend/tests/release-01520-version.test.js
      - name: Commit beta3 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md custom_components/dashboardmodern/manifest.json \
                  custom_components/dashboardmodern/frontend/legacy/build-info.js \
                  custom_components/dashboardmodern/frontend/tests/release-01520-version.test.js
          git commit -m "chore: bump release to 1.0.0-beta.3"
          git push origin HEAD:fix/beta2-ui-coherence-report
