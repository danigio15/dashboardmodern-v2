name: Publish v0.14.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.14.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: 3799c040a337c4988689fe446ec063c46b1d3a1f
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build release archive
        run: python scripts/build_release.py --expected-commit 3799c040a337c4988689fe446ec063c46b1d3a1f --output dashboardmodern.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14.4
          target_commitish: 3799c040a337c4988689fe446ec063c46b1d3a1f
          generate_release_notes: true
          files: dashboardmodern.zip
