name: Apply vendor test update

on:
  push:
    branches:
      - agent/0.15.8-repository-cleanup-performance-brand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.15.8-repository-cleanup-performance-brand
          fetch-depth: 0
      - name: Update externalized source assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_vendor_features.py")
          source = path.read_text()
          source = source.replace(
              "import importlib.util\nimport sys\n",
              "import importlib.util\nimport re\nimport sys\n",
          )
          marker = '''VENDORED = Path(__file__).resolve().parents[1] / (
              "custom_components/dashboardmodern/frontend/legacy"
          )


          '''
          helper = '''VENDORED = Path(__file__).resolve().parents[1] / (
              "custom_components/dashboardmodern/frontend/legacy"
          )


def _variant_source(name: str) -> str:
              """Return the HTML shell plus every local asset it loads directly."""
              html = (VENDORED / name).read_text(encoding="utf-8")
              parts = [html]
              references = re.findall(r'(?:src|href)="\\./([^"?#]+)', html)
              for reference in references:
                  asset = VENDORED / reference
                  if asset.is_file() and asset.suffix in {".js", ".css", ".html"}:
                      parts.append(asset.read_text(encoding="utf-8"))
              return "\\n".join(parts)


          '''
          if marker not in source:
              raise SystemExit("vendor test insertion marker missing")
          source = source.replace(marker, helper, 1)
          source = source.replace(
              'html = (VENDORED / name).read_text(encoding="utf-8")',
              'html = _variant_source(name)',
          )
          source = source.replace(
              'def _variant_source(name: str) -> str:\n    """Return the HTML shell plus every local asset it loads directly."""\n    html = _variant_source(name)',
              'def _variant_source(name: str) -> str:\n    """Return the HTML shell plus every local asset it loads directly."""\n    html = (VENDORED / name).read_text(encoding="utf-8")',
              1,
          )
          path.write_text(source)
          PY
          rm .github/workflows/apply-vendor-test-update.yml
          python -m pytest -q tests/test_vendor_features.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: follow externalized legacy runtime assets"
          git push origin HEAD:agent/0.15.8-repository-cleanup-performance-brand
