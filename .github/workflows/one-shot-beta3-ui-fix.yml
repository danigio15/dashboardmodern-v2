name: One-shot beta3 UI coherence patcher

on:
  push:
    branches:
      - fix/beta2-ui-coherence-report

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/beta2-ui-coherence-report
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: custom_components/dashboardmodern/frontend/package-lock.json
      - name: Apply UI coherence fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              (ROOT / path).write_text(text)

          def sub_once(path, pattern, replacement, flags=re.S):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {pattern[:80]}')
              write(path, updated)

          catalog = 'custom_components/dashboardmodern/frontend/src/core/personalization-catalog.js'
          personal = 'custom_components/dashboardmodern/frontend/src/sections/personalization-section.js'
          polish = 'custom_components/dashboardmodern/frontend/src/sections/editor-polish-section.js'
          report = 'custom_components/dashboardmodern/frontend/src/sections/energy-report-polish-section.js'
          period = 'custom_components/dashboardmodern/frontend/src/core/period-service.js'

          sub_once(
              catalog,
              r'export const ACTION_ICON_CATALOG = Object\.freeze\(\[.*?\]\.map\(\(\[id,it,en,mdi\]\) => Object\.freeze\(\{ id,it,en,mdi \}\)\)\);',
              '''export const ACTION_ICON_CATALOG = Object.freeze([\n  ["home","Casa","Home","mdi:home","🏠"],["lights","Luci","Lights","mdi:lightbulb","💡"],["climate","Clima","Climate","mdi:snowflake","❄️"],\n  ["heat","Riscaldamento","Heating","mdi:radiator","🔥"],["security","Sicurezza","Security","mdi:shield-home","🛡️"],["gate","Cancello","Gate","mdi:gate","🚪"],\n  ["shutters","Tapparelle","Shutters","mdi:window-shutter","🪟"],["scene","Scena","Scene","mdi:movie-open","🎬"],["script","Script","Script","mdi:script-text-play","▶️"],\n  ["power","Energia","Power","mdi:flash","⚡"],["ev","Auto","Car","mdi:car-electric","🚗"],["boiler","Boiler","Boiler","mdi:water-boiler","♨️"],\n  ["water","Acqua","Water","mdi:water","💧"],["camera","Telecamera","Camera","mdi:cctv","📷"],["bell","Avviso","Alert","mdi:bell","🔔"],["star","Preferito","Favorite","mdi:star","⭐"],\n].map(([id,it,en,mdi,glyph]) => Object.freeze({ id,it,en,mdi,glyph })));''',
          )

          sub_once(
              catalog,
              r'export function carBrandVisual\(value, size = 48\) \{.*?\n\}',
              '''export function carBrandVisual(value, size = 48) {\n  const item = brandMatch(value) || CAR_BRANDS.find((brand) => brand.name === "Leapmotor") || CAR_BRANDS[0];\n  const safeSize = Math.max(20, Math.min(160, Number(size) || 48));\n  const initials = item.initials || item.name.slice(0, 2).toUpperCase();\n  const fontSize = initials.length > 2 ? 10 : initials.length === 2 ? 13 : 16;\n  return `<span class="dm-car-brand" data-brand="${item.id}" title="${item.name}"><svg width="${safeSize}" height="${safeSize}" viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="3" width="42" height="42" rx="14" fill="currentColor" opacity=".12"/><circle cx="24" cy="24" r="15.5" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".9"/><path d="M12.5 29.5h23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".45"/><text x="24" y="28.5" text-anchor="middle" font-size="${fontSize}" font-family="system-ui,sans-serif" font-weight="900" fill="currentColor">${initials}</text></svg></span>`;\n}''',
          )

          text = read(catalog)
          marker = 'export function roomOptionsMarkup({ selected = "", english = false } = {}) {'
          if marker not in text:
              raise SystemExit('personalization catalog: roomOptionsMarkup marker missing')
          action_helpers = '''export function actionCatalogMatch(value) {\n  const token = normalized(value).replace(/^mdi:/, "").replace(/[-_]+/g, " ");\n  if (!token) return ACTION_ICON_CATALOG[0];\n  return ACTION_ICON_CATALOG.find((item) =>\n    normalized(item.id) === token || normalized(item.mdi).replace(/^mdi:/, "").replace(/[-_]+/g, " ") === token ||\n    normalized(item.it) === token || normalized(item.en) === token\n  ) || null;\n}\n\nexport function actionVisual(value, size = 48) {\n  const item = actionCatalogMatch(value);\n  if (!item) return "";\n  const safeSize = Math.max(20, Math.min(160, Number(size) || 48));\n  const glyphSize = Math.max(16, Math.round(safeSize * 0.55));\n  return `<span class="dm-action-glyph" data-action="${item.id}" title="${item.it}" style="width:${safeSize}px;height:${safeSize}px;font-size:${glyphSize}px"><span aria-hidden="true">${item.glyph}</span></span>`;\n}\n\n'''
          text = text.replace(marker, action_helpers + marker, 1)
          write(catalog, text)

          text = read(personal)
          old_import = 'import { ACTION_ICON_CATALOG, CAR_BRANDS, ROOM_CATALOG, carBrandVisual, roomVisual } from "../core/personalization-catalog.js";'
          new_import = 'import { ACTION_ICON_CATALOG, CAR_BRANDS, ROOM_CATALOG, actionVisual, carBrandVisual, roomVisual } from "../core/personalization-catalog.js";'
          if old_import not in text:
              raise SystemExit('personalization import marker missing')
          text = text.replace(old_import, new_import, 1)
          write(personal, text)

          sub_once(
              personal,
              r'function openVisualPicker\(input, kind = "room"\) \{.*?\n\}\n\nfunction decorateRoomModal\(',
              '''function openVisualPicker(input, kind = "room") {\n  if (!input) return;\n  closePicker();\n  const modal = doc.createElement("div");\n  modal.id = "dm-visual-picker";\n  modal.className = "dm-section-modal dm-visual-picker";\n  modal.dataset.kind = kind;\n  const english = doc.documentElement.lang === "en";\n  const title = kind === "car" ? t("Scegli il brand auto", "Choose car brand") : kind === "action" ? t("Scegli l'icona azione", "Choose action icon") : t("Scegli l'icona stanza", "Choose room icon");\n  const titleIcon = kind === "car" ? "🚘" : kind === "action" ? "⚡" : "🏠";\n  const rows = kind === "car"\n    ? CAR_BRANDS.map((item) => ({ value: item.name, label: item.name, visual: carBrandVisual(item.name, 48), search: item.name }))\n    : kind === "action"\n      ? ACTION_ICON_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: actionVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.id} ${item.mdi}` }))\n      : ROOM_CATALOG.map((item) => ({ value: item.mdi, label: english ? item.en : item.it, visual: roomVisual(item.mdi, 46), search: `${item.it} ${item.en} ${item.keywords}` }));\n  modal.innerHTML = `<section class="dm-section-dialog dm-picker-dialog" role="dialog" aria-modal="true"><header><strong>${titleIcon} ${title}</strong><button type="button" data-close aria-label="${t("Chiudi", "Close")}">✕</button></header><div class="dm-picker-search"><input class="ed-input" type="search" placeholder="🔎 ${t("Cerca…", "Search…")}" data-search></div><div class="dm-picker-grid">${rows.map((item, index) => `<button type="button" class="dm-picker-option" data-index="${index}" data-search-text="${esc(item.search.toLowerCase())}"><span class="dm-picker-visual">${item.visual}</span><b>${esc(item.label)}</b></button>`).join("")}</div></section>`;\n  doc.body.append(modal);\n  modal.querySelector("[data-close]")?.addEventListener("click", closePicker);\n  modal.addEventListener("click", (event) => { if (event.target === modal) closePicker(); });\n  modal.querySelector("[data-search]")?.addEventListener("input", (event) => {\n    const q = clean(event.target.value).toLowerCase();\n    modal.querySelectorAll(".dm-picker-option").forEach((button) => { button.hidden = Boolean(q) && !button.dataset.searchText.includes(q); });\n  });\n  modal.querySelectorAll(".dm-picker-option").forEach((button) => button.addEventListener("click", () => {\n    const item = rows[Number(button.dataset.index)];\n    if (!item) return;\n    input.value = item.value;\n    emitChange(input);\n    closePicker();\n  }));\n  root.setTimeout?.(() => modal.querySelector("[data-search]")?.focus(), 30);\n}\n\nfunction decorateRoomModal(''',
          )

          sub_once(
              personal,
              r'function decorateRoomModal\(\) \{.*?\n\}\n\nfunction decorateActionModal\(',
              '''function decorateRoomModal() {\n  const modal = doc?.getElementById("dm-room-editor-modal");\n  if (!modal || modal.dataset.dmPersonalized === "true") return;\n  modal.dataset.dmPersonalized = "true";\n  const input = modal.querySelector('input[name="icon"]');\n  const row = input?.closest(".dm-unified-icon-row");\n  const preview = modal.querySelector("[data-room-icon-preview]");\n  if (!input || !row || !preview) return;\n  row.querySelectorAll(".dm-visual-pick-btn").forEach((node) => node.remove());\n  preview.classList.add("dm-visual-trigger");\n  preview.setAttribute("role", "button");\n  preview.setAttribute("tabindex", "0");\n  preview.setAttribute("aria-label", t("Scegli icona stanza", "Choose room icon"));\n  const open = () => openVisualPicker(input, "room");\n  preview.addEventListener("click", open);\n  preview.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });\n  const refresh = () => {\n    preview.innerHTML = roomVisual(input.value, 52) || iconMarkup(input.value || "mdi:home", 42);\n  };\n  input.addEventListener("input", refresh);\n  refresh();\n}\n\nfunction decorateActionModal(''',
          )

          sub_once(
              personal,
              r'function decorateActionModal\(\) \{.*?\n\}\n\nfunction temperatureRoomVisuals\(',
              '''function decorateActionModal() {\n  const modal = doc?.getElementById("dm-action-editor-modal");\n  if (!modal || modal.dataset.dmPersonalized === "true") return;\n  modal.dataset.dmPersonalized = "true";\n  const form = modal.querySelector("form");\n  const input = form?.elements?.icon;\n  const row = input?.closest(".dm-unified-icon-row");\n  const preview = form?.querySelector?.("[data-action-icon-preview]");\n  if (!input || !row || !preview) return;\n  const unlock = () => {\n    input.readOnly = false;\n    input.closest("label")?.classList.remove("dm-canonical-icon");\n  };\n  unlock();\n  form.elements.type?.addEventListener("change", () => root.queueMicrotask?.(unlock));\n  row.querySelectorAll(".dm-visual-pick-btn").forEach((node) => node.remove());\n  preview.classList.add("dm-visual-trigger");\n  preview.setAttribute("role", "button");\n  preview.setAttribute("tabindex", "0");\n  preview.setAttribute("aria-label", t("Scegli icona azione", "Choose action icon"));\n  const open = () => openVisualPicker(input, "action");\n  preview.addEventListener("click", open);\n  preview.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });\n  const refresh = () => { preview.innerHTML = actionVisual(input.value, 46) || iconMarkup(input.value, 40); };\n  input.addEventListener("input", refresh);\n  input.addEventListener("change", refresh);\n  refresh();\n}\n\nfunction temperatureRoomVisuals(''',
          )

          text = read(personal)
          marker = 'function sectionNames() {'
          if marker not in text:
              raise SystemExit('sectionNames marker missing')
          legacy_picker = '''function decorateLegacyIconPickers() {\n  doc?.querySelectorAll?.("button.dm-icon-picker").forEach((button) => {\n    const targetId = clean(button.dataset.iconTarget || button.dataset.entityTarget);\n    const input = (targetId && doc.getElementById(targetId)) || button.closest(".dm-icon-field,.ed-form-row")?.querySelector("input.ed-icon-input,input");\n    if (!input) return;\n    const category = clean(button.dataset.iconCategory || input.dataset.iconCategory);\n    button.classList.add("dm-icon-preview-button");\n    button.setAttribute("aria-label", category === "rooms" ? t("Scegli icona stanza", "Choose room icon") : t("Scegli icona", "Choose icon"));\n    const refresh = () => {\n      const value = clean(input.value);\n      button.innerHTML = category === "rooms" ? (roomVisual(value, 34) || iconMarkup(value || "mdi:home", 30)) : (actionVisual(value, 34) || iconMarkup(value || "mdi:star", 30));\n    };\n    if (button.dataset.dmVisualBound !== "true") {\n      button.dataset.dmVisualBound = "true";\n      input.addEventListener("input", refresh);\n      input.addEventListener("change", refresh);\n    }\n    refresh();\n  });\n}\n\n'''
          text = text.replace(marker, legacy_picker + marker, 1)
          write(personal, text)

          sub_once(
              personal,
              r'export function applySectionNames\(\) \{.*?\n\}\n\nfunction renameSection\(',
              '''const EDITOR_TABS_FOR_SECTION = Object.freeze({\n  home: ["sez0"], energy: ["sez1"], ev: ["sez2"], solar: ["sez3"], security: ["sez4"],\n  server: ["sez6"], temp: ["sez7"], actions: ["sez8"], clima: ["sez9"],\n  "appliances-main": ["appliances"], tapparelle: ["tapp"], irrigazione: ["irr"], piscina: ["pool"],\n});\n\nfunction replaceButtonLabel(button, value) {\n  if (!button || !value) return;\n  const textNodes = [...button.childNodes].filter((node) => node.nodeType === Node.TEXT_NODE && clean(node.textContent));\n  const target = textNodes.at(-1);\n  if (target) target.textContent = ` ${value}`;\n  else {\n    const label = button.querySelector("[data-dm-config-name]") || doc.createElement("span");\n    label.dataset.dmConfigName = "true";\n    label.textContent = value;\n    if (!label.isConnected) button.append(label);\n  }\n}\n\nexport function applySectionNames() {\n  const names = sectionNames();\n  Object.entries(names).forEach(([rawKey, name]) => {\n    const value = clean(name);\n    if (!value) return;\n    const key = PAGE_ALIASES[rawKey] || rawKey;\n    doc?.querySelectorAll?.(`.tab[data-tab="${CSS.escape(key)}"] .text`).forEach((node) => { node.textContent = value; });\n    if (rawKey === "appliances") doc?.querySelectorAll?.('.tab[data-tab="appliances-main"] .text').forEach((node) => { node.textContent = value; });\n    for (const editorTab of EDITOR_TABS_FOR_SECTION[key] || []) {\n      doc?.querySelectorAll?.(`.ed-tab[data-tab="${CSS.escape(editorTab)}"]`).forEach((button) => replaceButtonLabel(button, value));\n    }\n    const page = doc?.getElementById?.(`page-${key}`);\n    const selectors = key === "energy"\n      ? [".ed-title-text h2"]\n      : key === "appliances-main"\n        ? [".appl-main-title"]\n        : [".sec-header h1", ".sec-header h2", ".page-title", "h2.section-title"];\n    for (const selector of selectors) {\n      const target = page?.querySelector?.(selector);\n      if (target) { setTitleText(target, value); break; }\n    }\n  });\n}\n\nfunction renameSection(''',
          )

          sub_once(
              personal,
              r'function ensureSectionRenamer\(\) \{.*?\n\}\n\nfunction evVisual\(',
              '''function ensureSectionRenamer() {\n  const body = doc?.getElementById("ed-body");\n  if (!body) return;\n  body.querySelectorAll("[data-section-renamer]").forEach((node) => node.remove());\n  const intro = [...body.querySelectorAll(".ed-intro")].find((node) => /ordine navbar|navbar order/i.test(clean(node.textContent)));\n  if (!intro) return;\n  const keys = typeof root.cdNavKeys === "function" ? root.cdNavKeys() : [];\n  if (!Array.isArray(keys) || !keys.length) return;\n  let row = intro.nextElementSibling;\n  for (const key of keys) {\n    while (row && !row.classList.contains("ed-row")) row = row.nextElementSibling;\n    if (!row) break;\n    row.dataset.sectionKey = key;\n    const main = row.querySelector(".ed-row-main");\n    const labelNode = main?.querySelector(".ed-row-new");\n    if (main && !main.querySelector("[data-rename]")) {\n      const button = doc.createElement("button");\n      button.type = "button";\n      button.className = "dm-inline-rename";\n      button.dataset.rename = "true";\n      button.setAttribute("aria-label", t("Rinomina sezione", "Rename section"));\n      button.textContent = "✏️";\n      button.addEventListener("click", () => {\n        const current = clean(labelNode?.textContent).replace(/^\\S+\\s*/, "") || key;\n        renameSection(key, current);\n      });\n      main.append(button);\n    }\n    row = row.nextElementSibling;\n  }\n}\n\nfunction evVisual(''',
          )

          sub_once(
              personal,
              r'function ensureEvAppearanceEditor\(\) \{.*?\n\}\n\nfunction correctDisplayedVersion\(',
              '''function ensureEvAppearanceEditor() {\n  const body = doc?.getElementById("ed-body");\n  if (!body) return;\n  const activeTab = clean(doc.querySelector(".ed-tab.active")?.dataset?.tab);\n  if (activeTab !== "sez2") {\n    body.querySelectorAll("[data-ev-appearance]").forEach((node) => node.remove());\n    return;\n  }\n  if (body.querySelector("[data-ev-appearance]")) return;\n  const { current, fallback } = evVisual();\n  const visual = current || fallback || {};\n  const panel = doc.createElement("section");\n  panel.className = "ed-form dm-ev-appearance";\n  panel.dataset.evAppearance = "true";\n  const brand = clean(visual.brand || "Leapmotor");\n  const icon = clean(visual.icon || "mdi:car-electric");\n  panel.innerHTML = `<div class="ed-sec-title">🚘 ${t("Aspetto auto", "Car appearance")}</div><div class="ed-intro">${t("Aspetto del profilo auto selezionato.", "Appearance of the selected vehicle profile.")}</div><div class="dm-ev-appearance-grid"><button type="button" class="dm-brand-preview dm-visual-trigger" data-brand-preview aria-label="${t("Scegli brand auto", "Choose car brand")}">${carBrandVisual(brand, 56)}<b>${esc(brand)}</b></button><select class="ed-input" data-brand>${CAR_BRANDS.map((item) => `<option value="${esc(item.name)}" ${item.name === brand ? "selected" : ""}>${esc(item.name)}</option>`).join("")}</select><button type="button" class="dm-action-icon-preview dm-visual-trigger" data-icon-preview aria-label="${t("Scegli icona auto", "Choose car icon")}">${actionVisual(icon, 48) || iconMarkup(icon, 42)}</button><input class="ed-input" data-icon value="${esc(icon)}"></div><button type="button" class="ed-save-btn" data-save>💾 ${t("Salva aspetto auto", "Save car appearance")}</button>`;\n  const visibleEvBlock = [...body.querySelectorAll("details,.ed-acc,.ed-form")].find((node) => node !== panel && /auto elettric|electric car|profilo auto|car profile|vettur|vehicle/i.test(clean(node.textContent)));\n  if (visibleEvBlock?.parentElement) visibleEvBlock.insertAdjacentElement("afterend", panel);\n  else body.prepend(panel);\n  const brandSelect = panel.querySelector("[data-brand]");\n  const iconInput = panel.querySelector("[data-icon]");\n  brandSelect.addEventListener("change", () => { panel.querySelector("[data-brand-preview]").innerHTML = `${carBrandVisual(brandSelect.value, 56)}<b>${esc(brandSelect.value)}</b>`; });\n  panel.querySelector("[data-brand-preview]").addEventListener("click", () => openVisualPicker(brandSelect, "car"));\n  panel.querySelector("[data-icon-preview]").addEventListener("click", () => openVisualPicker(iconInput, "action"));\n  iconInput.addEventListener("input", () => { panel.querySelector("[data-icon-preview]").innerHTML = actionVisual(iconInput.value, 48) || iconMarkup(iconInput.value, 42); });\n  panel.querySelector("[data-save]").addEventListener("click", async (event) => {\n    const button = event.currentTarget;\n    button.disabled = true;\n    panel.dataset.saved = "saving";\n    try {\n      const livePanel = button.closest("[data-ev-appearance]") || panel;\n      const liveBrand = clean(livePanel?.querySelector("select[data-brand]")?.value);\n      const liveIcon = clean(livePanel?.querySelector("input[data-icon]")?.value) || "mdi:car-electric";\n      if (!liveBrand) throw new Error(t("Seleziona un brand auto.", "Choose a car brand."));\n      await saveEvAppearance(liveBrand, liveIcon);\n      panel.dataset.saved = "true";\n    } catch (error) {\n      panel.dataset.saved = "error";\n      console.error("[DashboardModern] EV appearance save failed", error);\n    } finally {\n      button.disabled = false;\n    }\n  });\n}\n\nfunction correctDisplayedVersion(''',
          )

          text = read(personal)
          old = '''    decorateActionModal();\n    temperatureRoomVisuals();'''
          new = '''    decorateActionModal();\n    decorateLegacyIconPickers();\n    temperatureRoomVisuals();'''
          if old not in text:
              raise SystemExit('schedule marker missing')
          text = text.replace(old, new, 1)
          write(personal, text)

          sub_once(
              personal,
              r'function installStyles\(\) \{.*?\n\}\n\nexport function installPersonalizationSection\(',
              '''function installStyles() {\n  installStyle("dm-personalization-style", `\n    .dm-visual-picker{z-index:100020!important}.dm-picker-dialog{width:min(760px,calc(100vw - 24px))!important;max-height:min(82vh,760px)!important}.dm-picker-search{padding:14px 18px 6px}.dm-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;padding:12px 18px 20px;overflow:auto}.dm-picker-option{display:grid;place-items:center;gap:7px;min-height:108px;padding:10px;border:1px solid var(--divider-color,#dbe4ee);border-radius:16px;background:var(--card-background-color,#fff);color:var(--primary-text-color,#0f172a);cursor:pointer}.dm-picker-option:hover{border-color:var(--primary-color,#0ea5e9);transform:translateY(-1px)}.dm-picker-option b{font-size:12px;line-height:1.2;text-align:center}.dm-picker-option[hidden]{display:none!important}.dm-picker-visual{display:grid;place-items:center;min-width:52px;min-height:52px}.dm-room-art,.dm-car-brand{display:inline-grid;place-items:center;color:var(--primary-color,#0ea5e9)}.dm-action-glyph{display:inline-grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--primary-color,#0ea5e9) 10%,var(--card-background-color,#fff));line-height:1}\n    .dm-unified-icon-row{grid-template-columns:72px minmax(0,1fr)!important}.dm-visual-pick-btn{display:none!important}.dm-visual-trigger,.dm-icon-preview-button{cursor:pointer!important;transition:transform .15s ease,box-shadow .15s ease!important}.dm-visual-trigger:hover,.dm-icon-preview-button:hover{transform:translateY(-1px)!important}.dm-unified-icon-preview.dm-visual-trigger,.dm-action-icon-preview.dm-visual-trigger{display:grid!important;place-items:center!important;width:72px!important;height:72px!important;border:1px solid var(--divider-color,#dbe4ee)!important;border-radius:18px!important;background:var(--secondary-background-color,#eef3f8)!important}.dm-icon-picker.dm-icon-preview-button{display:grid!important;place-items:center!important;min-width:54px!important;width:54px!important;height:54px!important;padding:0!important;border-radius:14px!important;font-size:0!important}.dm-temperature-card-icon{display:grid!important;place-items:center!important;width:52px!important;height:52px!important;border-radius:16px!important;background:color-mix(in srgb,var(--primary-color,#0ea5e9) 10%,transparent)!important;overflow:hidden!important}.dm-temperature-form{border:1px solid var(--divider-color,#dbe4ee)!important;border-radius:20px!important;padding:18px!important;background:var(--card-background-color,#fff)!important;display:grid!important;gap:14px!important}.dm-temperature-form>.ed-slot{margin:0!important}.dm-temperature-actions{display:flex!important;gap:10px!important;justify-content:flex-end!important}\n    .dm-inline-rename{display:grid;place-items:center;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:1px solid color-mix(in srgb,var(--primary-color,#0ea5e9) 28%,var(--divider-color,#dbe4ee));border-radius:12px;background:color-mix(in srgb,var(--primary-color,#0ea5e9) 8%,var(--card-background-color,#fff));cursor:pointer}.ed-row[data-section-key] .ed-row-main{position:relative;padding-right:48px!important}\n    .dm-ev-appearance{margin:12px 0 18px!important}.dm-ev-appearance-grid{display:grid;grid-template-columns:auto minmax(170px,1fr) auto minmax(170px,1fr);gap:10px;align-items:center;margin:12px 0}.dm-brand-preview{display:flex;align-items:center;gap:8px;border:1px solid var(--divider-color,#dbe4ee);border-radius:14px;background:var(--secondary-background-color,#eef3f8);padding:6px 10px;cursor:pointer;color:var(--primary-text-color,#0f172a)}.dm-ev-brand-badge{display:inline-flex;align-items:center;gap:6px;margin-right:10px}.dm-action-icon-preview{display:grid;place-items:center;width:58px;height:58px;border:1px solid var(--divider-color,#dbe4ee);border-radius:15px;background:var(--secondary-background-color,#eef3f8)}\n    #page-clima .clima-dashboard{max-width:1180px!important;margin-inline:auto!important}#page-clima .clima-premium-grid{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important;gap:16px!important;align-items:start!important}#page-clima .clima-premium-grid>:not([style*="grid-column"]){box-sizing:border-box!important;min-height:300px!important;height:clamp(300px,38vw,390px)!important;max-height:390px!important;border-radius:24px!important;padding:18px!important;overflow:hidden!important}#page-clima [class*="clima-controls"],#page-clima [class*="clima-ctl"]{margin-top:auto!important}\n    #ed-body [data-dm-edit-kind="action"]{border-radius:14px!important}#ed-body [data-dm-edit-kind="action"]+button{border-radius:12px!important}\n    @media(max-width:760px){.dm-ev-appearance-grid{grid-template-columns:1fr auto}.dm-brand-preview{grid-column:1/-1}.dm-ev-appearance-grid select{grid-column:1/-1}.dm-picker-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dm-picker-option{min-height:102px;padding:8px}.dm-unified-icon-row{grid-template-columns:64px minmax(0,1fr)!important}.dm-unified-icon-preview.dm-visual-trigger,.dm-action-icon-preview.dm-visual-trigger{width:64px!important;height:64px!important}.dm-inline-rename{right:5px;width:36px;height:36px}#page-clima .clima-premium-grid{grid-template-columns:1fr!important;gap:12px!important}#page-clima .clima-premium-grid>:not([style*="grid-column"]){min-height:300px!important;height:clamp(300px,48vh,370px)!important;max-height:370px!important;padding:14px!important}}\n  `);\n}\n\nexport function installPersonalizationSection(''',
          )

          sub_once(
              polish,
              r'function renderServerCards\(panel, slots, visibleRefs\) \{.*?\n\}\n\nfunction ensureServerEditor\(',
              '''function renderServerCards(panel, slots, visibleRefs) {\n  const list = panel.querySelector("[data-server-list]");\n  if (!list) return;\n  const visible = slots.filter((slot) => visibleRefs.has(slot.ref));\n  list.innerHTML = visible.length\n    ? visible.map((slot) => `<article class="ed-row dm-server-row" data-ref="${esc(slot.ref)}"><span class="dm-server-icon">🖥️</span><div class="dm-server-copy"><strong>${esc(slot.label)}</strong><small class="mono">${esc(slot.ref)}</small><span class="dm-server-entity-row"><input class="ed-input mono" data-server-value data-entity-input="true" value="${esc(slot.value)}" placeholder="sensor.entity"><button type="button" class="dm-entity-picker" data-entity-target="" aria-label="${t("Seleziona entità", "Choose entity")}">🔍</button></span></div><button type="button" class="ed-del" data-remove aria-label="${t("Rimuovi", "Remove")}">🗑️</button></article>`).join("")\n    : `<div class="ed-empty">${t("Nessun parametro aggiunto. Scegline uno dal menu.", "No parameters added. Choose one from the menu.")}</div>`;\n  list.querySelectorAll(".dm-server-row").forEach((row, index) => {\n    const input = row.querySelector("[data-server-value]");\n    const pick = row.querySelector(".dm-entity-picker");\n    if (input && pick) {\n      const id = `dm-server-entity-${index}-${Math.random().toString(36).slice(2, 7)}`;\n      input.id = id;\n      pick.dataset.entityTarget = id;\n    }\n  });\n  list.querySelectorAll("[data-remove]").forEach((button) => button.addEventListener("click", () => {\n    const ref = button.closest("[data-ref]")?.dataset.ref;\n    const slot = slots.find((item) => item.ref === ref);\n    if (slot) {\n      slot.value = "";\n      storeServerValue(slot, "");\n    }\n    visibleRefs.delete(ref);\n    renderServerCards(panel, slots, visibleRefs);\n    root.setTimeout?.(() => root.DashboardModernModules?.render?.mountEntityPickers?.(panel), 0);\n  }));\n}\n\nfunction ensureServerEditor(''',
          )

          text = read(polish)
          old_css = '.dm-server-row{display:grid!important;grid-template-columns:48px minmax(0,1fr) 48px!important;gap:12px!important;align-items:start!important}.dm-server-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,#0ea5e9 12%,transparent);font-size:20px}.dm-server-row .ed-form-row{margin-top:9px!important}'
          new_css = '.dm-server-row{display:grid!important;grid-template-columns:48px minmax(0,1fr) 48px!important;gap:12px!important;align-items:start!important;min-height:0!important;padding:14px!important}.dm-server-icon{display:grid!important;place-items:center!important;width:44px!important;height:44px!important;border-radius:14px!important;background:color-mix(in srgb,#0ea5e9 12%,transparent)!important;font-size:20px!important}.dm-server-copy{display:grid!important;gap:6px!important;min-width:0!important;color:var(--primary-text-color,#0f172a)!important;visibility:visible!important;opacity:1!important}.dm-server-copy>strong{display:block!important;font-size:14px!important;font-weight:900!important;color:var(--primary-text-color,#0f172a)!important}.dm-server-copy>small{display:block!important;font-size:10px!important;color:var(--secondary-text-color,#64748b)!important;overflow-wrap:anywhere!important}.dm-server-entity-row{display:grid!important;grid-template-columns:minmax(0,1fr) 46px!important;gap:8px!important;margin-top:3px!important}.dm-server-entity-row .ed-input{display:block!important;visibility:visible!important;opacity:1!important;min-width:0!important;width:100%!important;color:var(--primary-text-color,#0f172a)!important;background:var(--card-background-color,#fff)!important}'
          if old_css not in text:
              raise SystemExit('server CSS marker missing')
          text = text.replace(old_css, new_css, 1)
          write(polish, text)

          # Retry Recorder statistics without the optional units hint when a HA version/bridge rejects it.
          sub_once(
              period,
              r'    const result = await this\.cachedRequest\(\n      \{\n        type: "recorder/statistics_during_period",\n        start_time: startIso,\n        end_time: endIso,\n        statistic_ids: statisticIds,\n        period,\n        types: \["sum"\],\n        units: \{ energy: "kWh" \},\n      \},\n      key,\n      historical \? this\.cacheHistoricalMs : this\.cacheCurrentMs,\n    \);',
              '''    const payload = {\n      type: "recorder/statistics_during_period",\n      start_time: startIso,\n      end_time: endIso,\n      statistic_ids: statisticIds,\n      period,\n      types: ["sum"],\n      units: { energy: "kWh" },\n    };\n    let result;\n    try {\n      result = await this.cachedRequest(\n        payload,\n        key,\n        historical ? this.cacheHistoricalMs : this.cacheCurrentMs,\n      );\n    } catch (error) {\n      const compatiblePayload = { ...payload };\n      delete compatiblePayload.units;\n      const compatibleKey = `${key}|compat`;\n      result = await this.cachedRequest(\n        compatiblePayload,\n        compatibleKey,\n        historical ? this.cacheHistoricalMs : this.cacheCurrentMs,\n      );\n    }''',
          )

          sub_once(
              report,
              r'  \} catch \(error\) \{\n    root\.console\?\.warn\?\.\("\[DashboardModern\] real daily chart unavailable", error\);\n    chartMessage\(t\("Storico Home Assistant non raggiungibile: nessun dato stimato viene mostrato\.", "Home Assistant history is unavailable: no estimated data is shown\."\)\);\n    return false;\n  \}',
              '''  } catch (error) {\n    root.console?.warn?.("[DashboardModern] real daily chart unavailable", error);\n    if (typeof state.legacyDailyChart === "function") {\n      try {\n        destroyDailyChart(canvas);\n        loading.style.display = "none";\n        canvas.style.display = "block";\n        await state.legacyDailyChart(daysInMonth, selMonth, selYear);\n        canvas.dataset.dmHistoryFallback = "legacy-compatible";\n        return true;\n      } catch (fallbackError) {\n        root.console?.warn?.("[DashboardModern] compatible daily chart fallback unavailable", fallbackError);\n      }\n    }\n    chartMessage(t("Storico Home Assistant non raggiungibile per il periodo selezionato.", "Home Assistant history is unavailable for the selected period."));\n    return false;\n  }''',
          )

          # Source-level regression tests for the UI rules reported from the real phone.
          test_path = Path('custom_components/dashboardmodern/frontend/tests/beta3-ui-coherence.test.js')
          test_path.write_text(r'''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst ROOT = new URL("../", import.meta.url);\nconst read = (path) => readFile(new URL(path, ROOT), "utf8");\n\ntest("EV appearance is strictly scoped to the EV editor and is not prepended globally", async () => {\n  const source = await read("src/sections/personalization-section.js");\n  assert.match(source, /if \(activeTab !== "sez2"\)/);\n  assert.match(source, /querySelectorAll\("\[data-ev-appearance\]"\).*remove/);\n  assert.match(source, /visibleEvBlock\.insertAdjacentElement\("afterend", panel\)/);\n});\n\ntest("room and action icon previews are the picker buttons and palette buttons are hidden", async () => {\n  const source = await read("src/sections/personalization-section.js");\n  assert.match(source, /preview\.addEventListener\("click", open\)/);\n  assert.match(source, /openVisualPicker\(input, "room"\)/);\n  assert.match(source, /openVisualPicker\(input, "action"\)/);\n  assert.match(source, /\.dm-visual-pick-btn\{display:none!important\}/);\n  assert.match(source, /dm-icon-preview-button/);\n});\n\ntest("action and car pickers always contain visible local artwork", async () => {\n  const catalog = await read("src/core/personalization-catalog.js");\n  const source = await read("src/sections/personalization-section.js");\n  assert.match(catalog, /export function actionVisual/);\n  assert.match(catalog, /"mdi:lightbulb","💡"/);\n  assert.match(source, /actionVisual\(item\.mdi, 46\)/);\n  assert.match(catalog, /const fontSize = initials\.length/);\n});\n\ntest("section rename is inline with navbar order and updates editor tab labels", async () => {\n  const source = await read("src/sections/personalization-section.js");\n  assert.match(source, /ordine navbar\|navbar order/i);\n  assert.match(source, /button\.className = "dm-inline-rename"/);\n  assert.match(source, /EDITOR_TABS_FOR_SECTION/);\n  assert.match(source, /\.ed-tab\[data-tab=/);\n});\n\ntest("climate cards are capped on mobile and server rows expose their configured values", async () => {\n  const personal = await read("src/sections/personalization-section.js");\n  const polish = await read("src/sections/editor-polish-section.js");\n  assert.match(personal, /max-height:370px!important/);\n  assert.match(polish, /dm-server-copy/);\n  assert.match(polish, /dm-server-entity-row/);\n});\n\ntest("energy history retries compatible Recorder payload and can fall back to legacy chart", async () => {\n  const service = await read("src/core/period-service.js");\n  const report = await read("src/sections/energy-report-polish-section.js");\n  assert.match(service, /delete compatiblePayload\.units/);\n  assert.match(report, /state\.legacyDailyChart/);\n  assert.match(report, /dmHistoryFallback = "legacy-compatible"/);\n});\n''')
          PY
      - name: Validate JavaScript and tests
        working-directory: custom_components/dashboardmodern/frontend
        run: |
          npm ci
          node --check src/core/personalization-catalog.js
          node --check src/sections/personalization-section.js
          node --check src/sections/editor-polish-section.js
          node --check src/sections/energy-report-polish-section.js
          node --check src/core/period-service.js
          npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/src/core/personalization-catalog.js \
                  custom_components/dashboardmodern/frontend/src/core/period-service.js \
                  custom_components/dashboardmodern/frontend/src/sections/personalization-section.js \
                  custom_components/dashboardmodern/frontend/src/sections/editor-polish-section.js \
                  custom_components/dashboardmodern/frontend/src/sections/energy-report-polish-section.js \
                  custom_components/dashboardmodern/frontend/tests/beta3-ui-coherence.test.js
          git commit -m "fix: cohere beta UI editors and energy history"
          git push origin HEAD:fix/beta2-ui-coherence-report
