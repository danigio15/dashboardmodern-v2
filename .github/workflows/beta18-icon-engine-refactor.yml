name: Beta18 Icon Engine Refactor

on:
  push:
    branches:
      - fix/beta18-icon-engine-single-owner

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/beta18-icon-engine-single-owner
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Consolidate icon ownership
        run: python scripts/beta18_icon_engine_refactor.py
      - name: Format transformed sources
        run: npm run format
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make icon engine the single visual owner"
          git push origin HEAD:fix/beta18-icon-engine-single-owner
