name: Beta17 Prettier Formatter

on:
  push:
    branches:
      - fix/beta17-final-icon-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/beta17-final-icon-polish
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format and commit
        run: |
          npm run format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/dashboardmodern/frontend/e2e custom_components/dashboardmodern/frontend/legacy/build-info.js
          git commit -m "style: format beta17 e2e"
          git push origin HEAD:fix/beta17-final-icon-polish
