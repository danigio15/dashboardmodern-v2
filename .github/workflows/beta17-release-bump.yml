name: Beta17 Release Bump

on:
  push:
    branches:
      - fix/beta17-final-icon-polish

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/beta17-final-icon-polish
          fetch-depth: 0
      - name: Apply beta17 release metadata
        run: python scripts/beta17_release_bump.py
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare 1.0.0-beta.17"
          git push origin HEAD:fix/beta17-final-icon-polish
