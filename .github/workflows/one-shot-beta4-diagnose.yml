name: Beta4 frontend diagnostics

on:
  push:
    branches:
      - fix/beta4-mobile-polish
    paths-ignore:
      - frontend-beta4.log

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Capture frontend output
        run: |
          python scripts/generate_build_info.py --expected-commit "$GITHUB_SHA"
          set +e
          { npm run check:inline-syntax; npm run test:frontend; } > frontend-beta4.log 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-beta4.log
          git commit -m "chore: capture beta4 frontend diagnostics" || exit 0
          git push
